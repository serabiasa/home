<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#101f3a" />
  <title>Fisika Kelas X | SMA Kolese Gonzaga</title>
  <style>
    /* ==========================================================
       PENGATURAN WARNA UTAMA — bisa disesuaikan nanti.
       ========================================================== */
    :root {
      --accent: #5169ec;
      --page: #f5f7fc;
      --topbar: #ffffff;
      --sidebar: #101f3a;
      --sidebar-text: #e8efff;
      --sidebar-border: #ffffff1b;
      --nav-active: #405bcd;
      --nav-hover: #ffffff13;
      --ink: #192a49;
      --muted: #8190a7;
      --line: #e4e9f2;
      --card: #ffffff;
      --card-border: #e5eaf3;
      --tile-bg: #eef0ff;
      --hero: linear-gradient(120deg, #4355c7, #8294ef);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--ink); }
    button { font: inherit; cursor: pointer; }
    button:focus-visible { outline: 3px solid #ffc145; outline-offset: 2px; }
    .app { min-height: 100vh; display: flex; background: var(--page); }
    .sidebar {
      position: sticky; top: 0; align-self: flex-start; height: 100vh; overflow-y: auto;
      width: 247px; flex: 0 0 247px; display: flex; flex-direction: column;
      background: var(--sidebar); color: var(--sidebar-text);
      border-right: 1px solid var(--sidebar-border);
    }
    .brand { padding: 29px 19px 31px; display: flex; align-items: center; gap: 12px; }
    .brand-icon {
      width: 44px; height: 44px; flex-shrink: 0; border-radius: 11px;
      background: #697aff; color: #fff; display: grid; place-items: center;
      overflow: hidden; font-size: 24px; font-weight: 900;
    }
    .brand-icon img { width: 100%; height: 100%; object-fit: contain; display: block; }
    .brand-name { font-size: 16px; font-weight: 850; letter-spacing: -.5px; line-height: 1.15; }
    .brand-sub { font-size: 10px; opacity: .65; margin-top: 6px; letter-spacing: .1px; }
    .menu-caption { margin: 0 19px 12px; font-size: 10px; font-weight: 800; opacity: .5; letter-spacing: 1.3px; }
    .nav { padding: 0 9px; display: flex; flex-direction: column; gap: 5px; }
    .nav-item {
      appearance: none; background: transparent; border: 0; width: 100%;
      color: var(--sidebar-text); opacity: .76; text-align: left; border-radius: 9px;
      padding: 12px 10px; display: flex; align-items: center; gap: 10px;
      line-height: 1.4; transition: background .15s;
    }
    .nav-item:hover { background: var(--nav-hover); opacity: 1; }
    .nav-item.active { background: var(--nav-active); color: white; opacity: 1; font-weight: 750; }
    .nav-icon { width: 25px; height: 24px; flex-shrink: 0; display: grid; place-items: center; font-size: 19px; }
    .nav-text { font-size: 12px; }
    /* Menu Referensi Eksternal dan Tentang Developer terpisah dari topik pembelajaran. */
    .support-menu { margin: 19px 9px 0; padding-top: 15px; border-top: 1px solid var(--sidebar-border); }
    .support-menu .menu-caption { margin-left: 10px; margin-bottom: 10px; }
    .sidebar-bottom { margin-top: auto; padding: 22px 19px; font-size: 10px; line-height: 1.8; opacity: .58; border-top: 1px solid var(--sidebar-border); }

    .main { flex: 1; min-width: 0; min-height: 100vh; }
    .topline {
      height: 67px; padding: 0 37px; display: flex; justify-content: space-between;
      align-items: center; border-bottom: 1px solid var(--line); background: var(--topbar);
    }
    .crumb { font-size: 12px; color: var(--muted); }
    .crumb strong { color: var(--ink); }
    .top-tag { font-size: 11px; border: 1px solid var(--line); border-radius: 30px; padding: 8px 13px; font-weight: 750; color: var(--muted); white-space: nowrap; }
    .content { max-width: 1130px; margin: 0 auto; padding: 38px 37px 55px; }
    .eyebrow { color: var(--accent); font-size: 11px; letter-spacing: 1.8px; font-weight: 850; text-transform: uppercase; margin-bottom: 13px; }
    h1,h2,h3,p { margin: 0; }
    h1 { font-weight: 850; font-size: clamp(30px, 4vw, 47px); letter-spacing: -1.7px; line-height: 1.16; }
    .intro { font-size: 13px; line-height: 1.8; color: var(--muted); max-width: 650px; margin: 14px 0 25px; }
    .hero { position: relative; display: flex; align-items: center; overflow: hidden; min-height: 205px; padding: 29px 31px; background: var(--hero); color: white; border-radius: 16px; margin-bottom: 29px; }
    .hero-copy { z-index: 1; position: relative; max-width: 70%; }
    .hero-kicker { font-size: 10px; letter-spacing: 1.6px; font-weight: 850; opacity: .75; margin-bottom: 13px; }
    .hero h2 { font-size: clamp(21px, 2.5vw, 27px); letter-spacing: -.8px; line-height: 1.2; margin-bottom: 10px; }
    .hero p { font-size: 12px; line-height: 1.7; opacity: .83; }
    .orbits { position: absolute; width: 250px; height: 250px; right: -12px; top: -20px; border: 1px solid #ffffff55; border-radius: 50%; display: grid; place-items: center; transform: rotate(-24deg); }
    .orbits::before,.orbits::after { content: ""; position: absolute; border: 1px solid #ffffff55; border-radius: 50%; width: 157px; height: 157px; }
    .orbits::after { height: 80px; width: 80px; background: #ffffff22; }
    .orbit-symbol { font-size: 59px; font-weight: 300; position: relative; z-index: 1; }
    .section-heading { display: flex; justify-content: space-between; align-items: end; margin-bottom: 16px; gap: 10px; }
    .section-heading h2 { font-size: 19px; letter-spacing: -.5px; }
    .section-heading span { font-size: 11px; color: var(--muted); }
    .topic-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 13px; }
    .topic-card { background: var(--card); border: 1px solid var(--card-border); color: var(--ink); padding: 20px; text-align: left; border-radius: 13px; min-height: 158px; display: flex; flex-direction: column; align-items: flex-start; transition: transform .15s, box-shadow .15s; }
    .topic-card:hover { transform: translateY(-2px); box-shadow: 0 7px 20px #14254216; }
    .tile-icon { height: 37px; width: 37px; border-radius: 9px; background: var(--tile-bg); color: var(--accent); display: grid; place-items: center; font-size: 23px; margin-bottom: 17px; }
    .tile-title { font-size: 13px; font-weight: 800; line-height: 1.45; }
    .tile-footer { margin-top: auto; padding-top: 15px; font-size: 11px; color: var(--muted); display: flex; justify-content: space-between; width: 100%; }
    .topic-actions { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 13px; margin-top: 22px; }
    .unit-box { background: var(--card); border: 1px solid var(--card-border); border-radius: 12px; padding: 21px; min-height: 170px; }
    .unit-id { font-size: 10px; letter-spacing: 1px; color: var(--accent); font-weight: 850; margin-bottom: 16px; }
    .unit-box h3 { font-size: 16px; line-height: 1.4; margin-bottom: 8px; }
    .unit-box p { font-size: 12px; color: var(--muted); line-height: 1.65; }
    .unit-status { display: inline-block; margin-top: 17px; font-size: 10px; font-weight: 800; border: 1px dashed var(--line); padding: 6px 8px; border-radius: 6px; color: var(--muted); }
    .coming-banner { border: 1px dashed var(--line); color: var(--muted); padding: 19px; border-radius: 11px; margin-top: 19px; font-size: 12px; line-height: 1.7; }
    /* ==========================================================
       DESAIN STUDY NOTES — BESARAN DAN SATUAN
       Tabel ini digunakan saat kartu Study notes dibuka.
       ========================================================== */
    .unit-box.unit-action { appearance: none; width: 100%; text-align: left; color: var(--ink); cursor: pointer; font: inherit; transition: transform .15s, box-shadow .15s, border-color .15s; }
    .unit-box.unit-action:hover { transform: translateY(-2px); border-color: #abb9fa; box-shadow: 0 7px 20px #14254216; }
    .unit-box.unit-action .unit-status { color: var(--accent); background: var(--tile-bg); border-color: #dce2ff; }
    /* Kartu Refleksi Hukum Kekekalan Energi tetap tampil tetapi nonaktif. */
    .unit-box.unit-coming-soon { background: #eef1f6; border-color: #e0e5ed; color: #8793a5; cursor: not-allowed; }
    .unit-box.unit-coming-soon .unit-id,
    .unit-box.unit-coming-soon h3,
    .unit-box.unit-coming-soon p { color: #8994a5; }
    .unit-box.unit-coming-soon .unit-status { background: #e4e8ef; color: #78869a; border-color: #d5dce6; }
    .notes-back { display: inline-flex; align-items: center; gap: 9px; padding: 9px 13px; background: #fff; border: 1px solid var(--line); border-radius: 9px; color: var(--ink); font-size: 12px; font-weight: 750; margin-bottom: 25px; }
    .notes-back:hover { background: var(--tile-bg); color: var(--accent); }
    .notes-table-wrap { border: 1px solid var(--card-border); border-radius: 14px; background: #fff; overflow-x: auto; }
    .notes-table { width: 100%; border-collapse: collapse; font-size: 13px; text-align: left; }
    .notes-table thead { background: #edf1fb; }
    .notes-table th { color: #586984; font-size: 11px; text-transform: uppercase; letter-spacing: .7px; padding: 16px 21px; }
    .notes-table th:first-child { width: 72%; }
    .notes-table th:last-child { min-width: 150px; }
    .notes-table td { padding: 19px 21px; border-top: 1px solid var(--line); vertical-align: middle; }
    .notes-table tbody tr:hover { background: #fbfcff; }
    .notes-title { font-weight: 750; color: var(--ink); line-height: 1.55; }
    .notes-number { color: var(--muted); font-weight: 750; margin-right: 13px; font-variant-numeric: tabular-nums; }
    .notes-link { display: inline-flex; align-items: center; gap: 6px; color: var(--accent); font-weight: 750; text-decoration: none; white-space: nowrap; }
    .notes-link:hover { text-decoration: underline; }
    .notes-placeholder { display: inline-block; font-size: 11px; background: #f1f3f8; color: #7c8ba3; border-radius: 7px; padding: 7px 10px; white-space: nowrap; }
    .notes-footnote { margin-top: 16px; font-size: 12px; line-height: 1.75; color: var(--muted); }
    @media (max-width: 520px) {
      .notes-table th, .notes-table td { padding: 14px 12px; }
      .notes-table th:last-child { min-width: 125px; }
      .notes-number { margin-right: 8px; }
    }


    /* ==========================================================
       HALAMAN SIMULASI, LATIHAN, REFLEKSI — BESARAN DAN SATUAN
       Silakan ubah warna, spasi, dan tipografi bagian ini.
       ========================================================== */
    .reflection-overview { display: flex; align-items: center; flex-wrap: wrap; gap: 9px; margin: 0 0 23px; }
    .reflection-step { background: #fff; color: #526281; border: 1px solid var(--line); border-radius: 30px; padding: 8px 12px; font-size: 11px; font-weight: 750; }
    .reflection-step-arrow { font-size: 14px; color: #9babc3; }
    .reflection-group { background: #fff; border: 1px solid var(--card-border); border-radius: 15px; margin: 0 0 19px; overflow: hidden; }
    /* ACCORDION REFLEKSI: <details> tertutup saat pertama dibuka.
       Klik ringkasan / tekan Enter atau Space untuk buka dan tutup. */
    .reflection-group-header { display: flex; gap: 14px; align-items: center; padding: 22px 24px; background: #f9fbff; cursor: pointer; list-style: none; transition: background .15s ease; }
    .reflection-group-header::-webkit-details-marker { display: none; }
    .reflection-group-header::marker { content: ''; }
    .reflection-group-header:hover { background: #f0f4ff; }
    .reflection-group-header:focus-visible { outline: 3px solid #ffc145; outline-offset: -4px; }
    .reflection-group[open] > .reflection-group-header { border-bottom: 1px solid var(--line); }
    .reflection-header-copy { flex: 1; min-width: 0; }
    .reflection-chevron { width: 32px; height: 32px; flex: 0 0 32px; display: grid; place-items: center; border-radius: 50%; background: #e9edff; color: var(--accent); font-size: 18px; font-weight: 700; transition: transform .2s ease, background .15s; }
    .reflection-group[open] .reflection-chevron { transform: rotate(180deg); background: #dce4ff; }
    .reflection-toggle-hint { display: inline-block; margin-top: 7px; color: var(--accent); font-size: 11px; font-weight: 750; }
    .reflection-group[open] .reflection-toggle-hint { display: none; }
    .reflection-level { min-width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center; background: #e9edff; color: var(--accent); font-size: 14px; font-weight: 850; }
    .reflection-level-name { font-size: 10px; font-weight: 850; color: var(--accent); letter-spacing: 1px; text-transform: uppercase; margin: 1px 0 6px; }
    .reflection-group h2 { font-size: 18px; letter-spacing: -.4px; line-height: 1.4; }
    .reflection-group-header p { font-size: 12px; color: var(--muted); line-height: 1.65; margin-top: 6px; }
    .reflection-list { list-style: none; padding: 0 24px; margin: 0; counter-reset: item; }
    .reflection-list li { display: grid; grid-template-columns: 32px minmax(0,1fr); gap: 12px; align-items: start; padding: 17px 0; border-bottom: 1px solid var(--line); }
    .reflection-list li:last-child { border-bottom: 0; }
    .reflection-question-no { font-size: 11px; font-weight: 850; color: var(--accent); line-height: 1.8; font-variant-numeric: tabular-nums; }
    .reflection-question { font-size: 13px; line-height: 1.75; color: var(--ink); }
    .challenge-box { border-radius: 15px; background: #eaf0ff; border: 1px solid #d4defb; padding: 25px; margin-top: 23px; }
    .challenge-box h2 { font-size: 20px; margin-bottom: 9px; letter-spacing: -.4px; }
    .challenge-box > p { color: #526487; font-size: 12px; line-height: 1.75; margin-bottom: 15px; }
    .challenge-list { margin: 0; padding-left: 21px; color: #263b61; }
    .challenge-list li { padding-left: 5px; margin: 9px 0; font-size: 13px; line-height: 1.7; }
    .reflection-ending { margin-top: 18px; font-size: 12px; line-height: 1.8; color: var(--muted); }
    @media (max-width: 520px) {
      .reflection-group-header { padding: 18px; }
      .reflection-list { padding: 0 18px; }
      .reflection-list li { gap: 8px; grid-template-columns: 25px minmax(0,1fr); }
      .challenge-box { padding: 19px; }
    }

    .mobile-menu { display: none; border: 1px solid var(--line); background: var(--card); border-radius: 7px; padding: 5px 9px; color: var(--ink); }
    .screen-overlay { display: none; }

    /* ==========================================================
       DESAIN HALAMAN TENTANG DEVELOPER
       Hanya berlaku untuk halaman Tentang Developer.
       ========================================================== */
    .help-layout { display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; max-width: 760px; }
    .developer-card { background: var(--card); border: 1px solid var(--card-border); border-radius: 15px; overflow: hidden; }
    .developer-heading { padding: 25px 28px; display: flex; align-items: center; gap: 17px; border-bottom: 1px solid var(--line); }
    .developer-avatar { width: 61px; height: 61px; flex-shrink: 0; border-radius: 16px; background: var(--tile-bg); color: var(--accent); display: grid; place-items: center; font-size: 29px; font-weight: 800; }
    .developer-kicker { font-size: 10px; font-weight: 850; color: var(--accent); letter-spacing: 1.3px; margin-bottom: 7px; }
    .developer-heading h2 { font-size: 20px; letter-spacing: -.5px; overflow-wrap: anywhere; }
    .developer-heading p { margin-top: 6px; color: var(--muted); font-size: 12px; }
    .developer-info { padding: 4px 28px 8px; }
    .developer-field { display: grid; grid-template-columns: 180px minmax(0,1fr); gap: 14px; padding: 19px 0; border-bottom: 1px solid var(--line); align-items: baseline; }
    .developer-field:last-child { border-bottom: 0; }
    .developer-field-label { font-size: 12px; color: var(--muted); font-weight: 650; }
    .developer-field-value { font-size: 13px; font-weight: 450; overflow-wrap: anywhere; }
    .developer-field-value a { color: var(--accent); text-decoration: none; border-bottom: 1px solid currentColor; padding-bottom: 2px; }
    .developer-field-value a:hover { color: #324aba; }
    .developer-field-value a:focus-visible { outline: 3px solid #ffc145; outline-offset: 4px; border-radius: 2px; }
    .developer-field-value .inactive-contact { color: var(--muted); font-weight: 600; }
    .developer-profile { display: flex; flex-direction: column; gap: 0.5em; line-height: 1.8; white-space: normal; font-weight: 450; }
    .help-note { background: #eef2ff; color: #475879; border: 1px solid #dae2fb; border-radius: 12px; padding: 16px 19px; font-size: 12px; line-height: 1.8; }
    /* ==========================================================
       DESAIN HALAMAN REFERENSI EKSTERNAL
       Ubah bagian ini kalau ingin menyesuaikan kartu sumber belajar.
       ========================================================== */
    .resource-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 15px; }
    .resource-card { background: var(--card); border: 1px solid var(--card-border); border-radius: 14px; padding: 22px; display: flex; flex-direction: column; gap: 12px; min-height: 215px; }
    .resource-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .resource-icon { height: 43px; width: 43px; background: var(--tile-bg); border-radius: 11px; color: var(--accent); font-size: 22px; display: grid; place-items: center; }
    .resource-category { color: var(--accent); font-size: 10px; font-weight: 800; letter-spacing: .8px; text-transform: uppercase; }
    .resource-card h2 { font-size: 17px; line-height: 1.3; letter-spacing: -.35px; }
    .resource-description { font-size: 12px; color: var(--muted); line-height: 1.7; }
    .resource-link { color: var(--accent); font-size: 12px; text-decoration: none; font-weight: 800; margin-top: auto; align-self: flex-start; border-bottom: 1px solid transparent; padding-top: 8px; }
    .resource-link:hover { border-bottom-color: currentColor; color: #324aba; }
    .resource-link:focus-visible { outline: 3px solid #ffc145; outline-offset: 4px; border-radius: 2px; }
    .resource-note { background: #eef2ff; color: #475879; border: 1px solid #dae2fb; border-radius: 12px; padding: 16px 19px; font-size: 12px; line-height: 1.8; margin-top: 20px; }
    @media (max-width: 620px) { .resource-grid { grid-template-columns: 1fr; } }

    @media (max-width: 520px) {
      .developer-heading { padding: 21px 18px; }
      .developer-info { padding: 4px 18px 8px; }
      .developer-field { grid-template-columns: 1fr; gap: 8px; }
      .developer-heading h2 { font-size: 18px; }
    }
    @media (max-width: 800px) {
      .sidebar { position: fixed; top: 0; left: 0; bottom: 0; z-index: 5; width: 247px; transform: translateX(-101%); transition: transform .2s; }
      .app.menu-open .sidebar { transform: translateX(0); }
      .app.menu-open .screen-overlay { display: block; position: fixed; inset: 0; background: #17132766; z-index: 4; }
      .mobile-menu { display: block; }
      .topline { height: 61px; padding: 0 20px; }
      .content { padding: 29px 20px 45px; }
      .top-tag { font-size: 10px; padding: 7px 9px; }
    }
    @media (max-width: 520px) {
      .top-tag { display: none; }
      .hero { padding: 22px; min-height: 185px; }
      .hero-copy { max-width: 82%; }
      .orbits { right: -105px; }
      .topic-card { padding: 15px; min-height: 151px; }
      .topic-actions { grid-template-columns: 1fr; }
      h1 { font-size: 31px; }
    }
  </style>
</head>
<body>
  <div class="app" id="app">
    <div class="screen-overlay" id="screenOverlay"></div>
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-icon">
          <!-- =======================================================
               TEMPAT LOGO SMA KOLESE GONZAGA
               Ganti tulisan sementara di bawah dengan tag berikut:
               <img src="logo-gonzaga.png" alt="Logo SMA Kolese Gonzaga">

               CARA PAKAI:
               1. Simpan file gambar logo di folder yang sama dengan HTML.
               2. Ganti logo-gonzaga.png sesuai nama file gambar lu.
               3. Hapus <span>φ</span> di bawah, lalu tempel tag <img>.

               Kalau logo di-host online, src boleh memakai URL penuh.
               ======================================================= -->
          <span>φ</span>
        </div>
        <div>
          <div class="brand-name">FISIKA KELAS X</div>
          <div class="brand-sub">SMA Kolese Gonzaga</div>
        </div>
      </div>
      <div class="menu-caption">TOPIK</div>
      <nav class="nav" id="nav" aria-label="Topik fisika"></nav>
      <!-- Menu bantuan dipisahkan agar tidak ikut muncul di kartu topik Home. -->
      <div class="support-menu">
        <div class="menu-caption">LAINNYA</div>
        <nav class="nav" aria-label="Referensi dan bantuan">
          <button class="nav-item" type="button" id="externalButton" data-external="true">
            <!-- Ikon globe SVG menggunakan currentColor sehingga warnanya sama dengan ikon sidebar lainnya. -->
            <span class="nav-icon" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"/></svg></span>
            <span class="nav-text">Referensi Eksternal</span>
          </button>
          <button class="nav-item" type="button" id="helpButton" data-help="true">
            <!-- Ikon Tentang Developer: U+24D8 (CIRCLED LATIN SMALL LETTER I) -->
            <span class="nav-icon" aria-hidden="true">ⓘ</span>
            <span class="nav-text">Tentang Developer</span>
          </button>
        </nav>
      </div>
      <div class="sidebar-bottom">FISIKA KELAS X<br>Portal pembelajaran interaktif<br>© 2026</div>
    </aside>
    <main class="main" id="main">
      <header class="topline">
        <div style="display:flex;align-items:center;gap:12px">
          <button class="mobile-menu" type="button" id="menuButton" aria-label="Buka menu">☰</button>
          <div class="crumb">Ruang Belajar &nbsp;/&nbsp; <strong id="crumb">Home</strong></div>
        </div>
        <div class="top-tag">✦ Fisika Kelas X with Serabi</div>
      </header>
      <section class="content" id="content"></section>
    </main>
  </div>

  <!-- ============================================================
       DATA MENU TOPIK
       Bagian ini tidak perlu diubah untuk mengedit tampilan Home.
       ============================================================ -->
  <script>
    const topics = [

        ? `<a href="mailto:${encodeURIComponent(developer.email).replace(/%40/g, '@')}?subject=${encodeURIComponent(emailSubject)}" title="Tulis email kepada developer">${escapeHTML(developer.email)} ↗</a>`

    function render() {
      nav.innerHTML = topics.map((topic, i) => `
        <button type="button" class="nav-item ${i === currentTopic ? 'active' : ''}"
          data-topic="${i}" ${i === currentTopic ? 'aria-current="page"' : ''}>
          <span class="nav-icon">${topic.icon}</span>
          <span class="nav-text">${escapeHTML(topic.name)}</span>
        </button>
      `).join('');
      const helpSelected = currentTopic === -1;
      const externalSelected = currentTopic === -2;
      const helpButton = document.getElementById('helpButton');
      const externalButton = document.getElementById('externalButton');
      helpButton.classList.toggle('active', helpSelected);
      externalButton.classList.toggle('active', externalSelected);
      if (helpSelected) helpButton.setAttribute('aria-current', 'page');
      else helpButton.removeAttribute('aria-current');
      if (externalSelected) externalButton.setAttribute('aria-current', 'page');
      else externalButton.removeAttribute('aria-current');
      const sectionNames = { notes: 'Study Notes', simulations: 'Simulasi Interaktif', exercises: 'Latihan Soal', reflection: 'Refleksi dan Tantangan' };
      const showingSection = activeSection && [1, 2, 3].includes(currentTopic);
      document.getElementById('crumb').textContent = externalSelected
        ? 'Referensi Eksternal'
        : (helpSelected ? 'Tentang Developer'
          : (showingSection ? topics[currentTopic].name + ' / ' + sectionNames[activeSection] : topics[currentTopic].name));
      if (externalSelected) content.innerHTML = renderExternalResources();
      else if (helpSelected) content.innerHTML = renderHelp();
      else if (currentTopic === 1 && activeSection === 'notes') content.innerHTML = renderBesaranStudyNotes();
      else if (currentTopic === 1 && ['simulations', 'exercises'].includes(activeSection)) content.innerHTML = renderBesaranLinkTable(activeSection);
      else if (currentTopic === 1 && activeSection === 'reflection') content.innerHTML = renderBesaranReflection();
      else if ([2, 3].includes(currentTopic) && ['notes', 'simulations', 'exercises'].includes(activeSection)) content.innerHTML = renderNewTopicLinkTable();
      else if (currentTopic === 2 && activeSection === 'reflection') content.innerHTML = renderIklimReflection();
      else content.innerHTML = currentTopic === 0 ? renderHome() : renderTopic();
      window.scrollTo({ top: 0, behavior: 'instant' });
    }

    document.addEventListener('click', event => {
      // Membuka subhalaman materi sesuai topik, tanpa pindah file HTML.
      const moduleButton = event.target.closest('[data-open-section]');
      if (moduleButton) {
        activeSection = moduleButton.dataset.openSection;
        render();
        return;
      }
      if (event.target.closest('[data-back-to-topic]')) {
        activeSection = null;
        render();
        return;
      }
      const externalButton = event.target.closest('[data-external]');
      if (externalButton) {
        currentTopic = -2;
        activeSection = null;
        app.classList.remove('menu-open');
        render();
        return;
      }
      const helpButton = event.target.closest('[data-help]');
      if (helpButton) {
        currentTopic = -1;
        activeSection = null;
        app.classList.remove('menu-open');
        render();
        return;
      }
      const topicButton = event.target.closest('[data-topic]');
      if (topicButton) {
        currentTopic = Number(topicButton.dataset.topic);
        activeSection = null;
        app.classList.remove('menu-open');
        render();
      }
    });
    document.getElementById('menuButton').addEventListener('click', () => app.classList.toggle('menu-open'));
    document.getElementById('screenOverlay').addEventListener('click', () => app.classList.remove('menu-open'));
    render();
  </script>
</body>
</html>
